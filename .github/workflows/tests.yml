name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the tags to work out the version
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      # The tests that need CCP4 are run offline with CCP4 loaded (see README)
      - name: Run tests
        run: pytest -m "not ccp4"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Same ruff version as .pre-commit-config.yaml
      - run: pip install ruff==0.7.0
      - run: ruff check
      - run: ruff format --check
